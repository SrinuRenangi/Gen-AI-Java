apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-backend
  namespace: production
  labels:
    app: enterprise-ai-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-ai-backend
  template:
    metadata:
      labels:
        app: enterprise-ai-backend
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/company/enterprise-ai-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: actuator
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # Kubernetes Health Probes matching Spring Boot Actuator
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 2
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: openai-key
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: enterprise-ai-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-ai-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-ai-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
